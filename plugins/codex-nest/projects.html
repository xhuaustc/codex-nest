<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Nest</title>
<style>
:root {
  color-scheme: light dark;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --surface: var(--color-background-primary, light-dark(#fff, #171717));
  --sidebar: var(--color-background-secondary, light-dark(#f7f7f7, #202020));
  --pressed: var(--color-background-tertiary, light-dark(#ebebeb, #333));
  --ink: var(--color-text-primary, light-dark(#171717, #f2f2f2));
  --muted: var(--color-text-secondary, light-dark(#626262, #aaa));
  --line: var(--color-border-secondary, light-dark(#e1e1e1, #3a3a3a));
  --focus: light-dark(#525252, #d4d4d4);
  --icon-ink: light-dark(#626262, #e1e6ee);
  --icon-active: light-dark(#252525, #f8faff);
  --remote-ink: light-dark(#304865, #e4eeff);
  --remote-surface: light-dark(#edf3fa, #2a3c55);
  --remote-border: light-dark(#bbcbe0, #7389a8);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100dvh;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 52px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 14px; font-weight: 650; }
header h1 { display: flex; align-items: center; gap: 7px; }
.nest-mark { display: flex; align-items: center; color: var(--icon-active); }
.nest-mark svg { display: block; width: 20px; height: 20px; }
nav h2, h3 { font-size: 12px; font-weight: 600; }
#project { font-size: 22px; line-height: 1.25; letter-spacing: -.015em; overflow-wrap: anywhere; }
button, a, input, select { font: inherit; color: inherit; }
button, input, select { min-height: 30px; border: 1px solid var(--line); border-radius: 7px; }
button { cursor: pointer; background: var(--surface); padding: 4px 9px; }
button:hover:not(:disabled) { background: var(--pressed); }
button:disabled { cursor: default; opacity: .5; }
:is(button, a, input, select):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { display: grid; grid-template-columns: clamp(222px, 32vw, 290px) minmax(0, 1fr); min-height: 0; }
nav, section { min-width: 0; overflow: auto; }
nav { padding: 15px 12px 20px; background: var(--sidebar); border-right: 1px solid var(--line); }
section { padding: clamp(16px, 4vw, 36px); }
.tree-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; }
.sidebar-actions { display: flex; align-items: center; gap: 2px; }
.icon-action { min-width: 28px; min-height: 27px; border: 0; padding: 0; background: transparent; color: var(--icon-ink); font-size: 17px; line-height: 1; }
.row .row-actions { flex: 0 0 27px; margin-right: 3px; opacity: 0; }
.row:is(:hover, :focus-within, :has([aria-current="true"])) .row-actions,
.row-actions[aria-expanded="true"] { opacity: 1; }
.row .row-actions:hover:not(:disabled), .icon-action[aria-expanded="true"] { color: var(--icon-active); background: var(--pressed); }
@media (hover: none) { .row .row-actions { opacity: 1; } }
#status { margin: 0 4px 6px; }
#status, #hint, #layout-message { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#layout-message:not(:empty), #hint:not(:empty) { margin: 10px 4px; }
ul { padding: 0; margin: 8px 0 0; list-style: none; }
li > ul { margin: 1px 0 2px 11px; padding-left: 5px; border-left: 1px solid var(--line); }
.row { display: flex; align-items: center; min-height: 31px; border-radius: 7px; }
.row:hover, .row:has(.name[aria-current="true"]) { background: var(--pressed); }
.row button { min-height: 27px; border: 0; background: transparent; }
.row button:hover:not(:disabled) { background: transparent; }
.row .name { display: flex; align-items: flex-start; gap: 7px; flex: 1; min-width: 0; padding: 4px 5px 4px 2px; text-align: left; }
.name-label { min-width: 0; }
.remote-label {
  flex: none;
  align-self: center;
  padding: 0 5px;
  border: 1px solid var(--remote-border);
  border-radius: 5px;
  background: var(--remote-surface);
  color: var(--remote-ink);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.project-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
.project-label-text { display: block; overflow: hidden; text-overflow: ellipsis; }
.name:is(:hover, :focus-visible) .project-label.is-overflowing .project-label-text {
  width: max-content;
  animation: reveal-name var(--name-duration) linear .35s both;
}
@keyframes reveal-name { to { transform: translateX(var(--name-travel)); } }
@media (prefers-reduced-motion: reduce) {
  .name:is(:hover, :focus-visible) .project-label.is-overflowing .project-label-text {
    animation: none;
    transform: translateX(var(--name-travel));
  }
}
.name.group-name, .name[aria-current="true"] { font-weight: 600; }
.name[draggable="true"] { cursor: grab; }
.row.drag-source { opacity: .48; }
.row.drag-source .project-label-text { animation: none; }
.row.drop-target, #root-drop.drop-target { outline: 1px solid var(--focus); outline-offset: -1px; background: var(--pressed); }
#root-drop { display: none; }
nav.project-dragging #root-drop {
  display: block;
  position: sticky;
  bottom: 0;
  margin: 8px 0 0;
  padding: 5px 8px;
  border: 1px dashed var(--line);
  border-radius: 7px;
  background: var(--sidebar);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.toggle, .spacer { flex: 0 0 22px; }
.toggle { display: grid; place-items: center; padding: 0; color: var(--icon-ink); }
.toggle:hover:not(:disabled) { color: var(--icon-active); }
.toggle::before { content: ""; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.4px 1.4px 0; transform: rotate(-45deg); }
.toggle[aria-expanded="true"]::before { transform: rotate(45deg) translateY(-1px); }
.node-icon { position: relative; flex: 0 0 12px; height: 10px; margin-top: 4px; border: 1px solid currentColor; border-radius: 2px; color: var(--icon-ink); }
.node-icon.project::before { content: ""; position: absolute; inset: 2px 0 auto; border-top: 1px solid currentColor; }
.node-icon.group::before { content: ""; position: absolute; top: -3px; left: -1px; width: 5px; height: 2px; border: 1px solid currentColor; border-bottom: 0; border-radius: 2px 2px 0 0; }
.node-icon.chat::after { content: ""; position: absolute; left: 2px; bottom: -2px; width: 3px; height: 3px; border-left: 1px solid currentColor; }
.tree-icon { display: block; flex: 0 0 12px; width: 12px; height: 10px; margin-top: 4px; color: var(--icon-ink); }
.name:is(:hover, :focus-visible, [aria-current="true"], [aria-expanded="true"]) .tree-icon { color: var(--icon-active); }
.tree-icon .icon-open { display: none; }
.name[aria-current="true"] .tree-icon.project .icon-closed,
.name[aria-expanded="true"] .tree-icon.group .icon-closed { display: none; }
.name[aria-current="true"] .tree-icon.project .icon-open,
.name[aria-expanded="true"] .tree-icon.group .icon-open { display: inline; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0; font-size: 12px; }
.controls input, .controls select { min-width: 0; flex: 1 1 100px; max-width: 100%; padding: 4px 7px; background: var(--surface); }
.controls input::placeholder { color: var(--muted); }
.controls[hidden], #conversations[hidden] { display: none; }
#move-node { max-width: 460px; margin: 16px 0; }
#move-node label { color: var(--muted); }
#sidebar-popover {
  position: fixed;
  inset: auto;
  width: min(310px, calc(100vw - 16px));
  max-height: calc(100dvh - 16px);
  overflow: auto;
  margin: 0;
  padding: 5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  box-shadow: 0 8px 24px #0002, 0 1px 4px #0001;
}
#sidebar-popover.context-actions { width: min(174px, calc(100vw - 16px)); }
.popover-heading { margin: 3px 6px 2px; overflow-wrap: anywhere; }
.popover-meta { margin: 0 6px 5px; color: var(--muted); font-size: 12px; }
.popover-divider { height: 1px; background: var(--line); margin: 4px; }
.popover-action { width: 100%; gap: 7px; border: 0; padding: 5px 7px; text-align: left; overflow-wrap: anywhere; }
.popover-error:not(:empty) { padding: 5px 7px; color: var(--muted); font-size: 12px; }
.editor-dialog {
  width: min(435px, calc(100vw - 24px));
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 18px;
}
.editor-dialog::backdrop { background: #0005; }
.editor { display: grid; gap: 8px; }
.editor h3 { font-size: 16px; margin-bottom: 2px; }
.editor label { font-size: 12px; color: var(--muted); }
.editor input, .editor textarea { color: inherit; background: var(--surface); font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
.editor textarea { min-height: 75px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
.editor textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.project-source { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
.project-source select, #project-group { width: 100%; color: inherit; background: var(--surface); padding: 4px 7px; }
.project-source-field { display: grid; gap: 5px; }
.project-source-field[hidden] { display: none; }
.editor-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
#save-project { background: var(--ink); color: var(--surface); }
#save-project:hover:not(:disabled) { opacity: .85; }
#project-action-status:not(:empty), #project-home-status:not(:empty) { margin: 9px 0; color: var(--muted); font-size: 12px; }
#conversations { margin-top: 22px; }
.chat-row { gap: 7px; padding: 5px 8px; border: 0; text-align: start; overflow-wrap: anywhere; }
#new-chat { max-width: 100%; margin: 8px 0 4px; background: var(--sidebar); font-weight: 600; }
#new-chat:hover:not(:disabled) { background: var(--pressed); }
#new-chat::before {
  content: "";
  flex: 0 0 12px;
  height: 12px;
  color: var(--icon-ink);
  background: linear-gradient(currentColor, currentColor) center / 10px 1px no-repeat,
    linear-gradient(currentColor, currentColor) center / 1px 10px no-repeat;
}
#chat-search {
  display: block;
  width: min(100%, 320px);
  margin: 4px 0 6px;
  padding: 5px 8px;
  background: var(--surface);
}
#chat-search::placeholder { color: var(--muted); }
#chats { margin-top: 0; }
#chats .chat-row { min-width: 0; flex: 1; align-items: flex-start; background: transparent; text-decoration: none; }
#chats .chat-row:hover { background: var(--pressed); }
.archive-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.archive-heading h2 { font-size: 16px; }
.archive-kind { margin-top: 14px; }
.archive-entry { gap: 8px; justify-content: space-between; padding: 4px 6px; }
.archive-entry div { min-width: 0; overflow-wrap: anywhere; }
.archive-entry small, #archive-status { color: var(--muted); font-size: 12px; }
.archive-entry small { display: block; }
#archive-status:not(:empty) { margin-top: 10px; }
.archive-entry button { flex: none; }
.archive-entry a { text-decoration: none; }
.archive-entry a:hover { text-decoration: underline; }
@media (max-width: 520px) {
  body { display: block; height: auto; min-height: 100dvh; }
  main { grid-template-columns: minmax(0, 1fr); }
  nav { max-height: 46dvh; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header><h1><span class="nest-mark" aria-hidden="true"></span>Codex Nest</h1></header>
<main>
<nav data-copy-label="projectTree">
  <div class="tree-heading"><h2 data-copy="projects">Projects</h2><div class="sidebar-actions">
    <button id="sidebar-menu" type="button" class="icon-action" data-copy-label="sidebarActions" data-copy-title="sidebarActions" aria-expanded="false" aria-controls="sidebar-popover" disabled>…</button>
    <button id="new-project" type="button" class="icon-action" data-copy-label="newProject" data-copy-title="newProject"
      aria-haspopup="dialog" aria-controls="editor-dialog" disabled>＋</button>
  </div></div>
  <p id="status" role="status" data-copy="loading">Loading…</p>
  <form id="create-group" class="controls" novalidate hidden>
    <input id="group-name" data-copy-label="groupName" data-copy-placeholder="groupName" required maxlength="60">
    <button type="submit" data-copy="newGroup">New group</button>
  </form>
  <p id="layout-message" role="status"></p><div id="tree"></div>
  <div id="root-drop" data-copy="dropAtTop">Move to top level</div>
</nav>
<section aria-labelledby="project">
  <h2 id="project" data-copy="chooseProject">Select a project or group</h2>
  <p id="project-action-status" role="status"></p>
  <p id="project-home-status" role="status"></p>
  <form id="move-node" class="controls" hidden>
    <label for="parent" data-copy="moveTo">Move to</label><select id="parent"></select><button type="submit" data-copy="move">Move</button>
  </form>
  <div id="conversations" hidden>
    <h3 data-copy="chats">Chats</h3>
    <button id="new-chat" class="row chat-row" type="button" data-copy="newChat" disabled>New chat</button>
    <input id="chat-search" type="search" autocomplete="off" data-copy-label="searchChats"
      data-copy-placeholder="searchChats" aria-controls="chats">
    <p id="hint" role="status"></p><ul id="chats"></ul>
  </div>
</section>
</main>
<div id="sidebar-popover" popover="manual" role="group" data-copy-label="projectActions"></div>
<dialog id="editor-dialog" class="editor-dialog" aria-labelledby="editor-title">
  <form id="project-editor" class="editor" novalidate>
    <h3 id="editor-title"></h3>
    <label for="project-name" data-copy="projectName">Project name</label><input id="project-name" required>
    <div class="project-source">
      <div id="project-device-field" class="project-source-field">
        <label for="project-device" data-copy="sourceDevice">Source device</label>
        <select id="project-device"></select>
      </div>
      <div id="local-project-folders" class="project-source-field">
        <label for="project-folders" data-copy="foldersLabel">Working directories (one existing folder per line)</label>
        <textarea id="project-folders" spellcheck="false" placeholder="~/work/project"></textarea>
      </div>
      <div id="remote-project-folder" class="project-source-field" hidden>
        <label for="project-remote-path" data-copy="remoteDirectory">Remote directory</label>
        <input id="project-remote-path" placeholder="/home/user/project" spellcheck="false" autocomplete="off">
      </div>
    </div>
    <div id="project-group-field" class="project-source-field">
      <label for="project-group" data-copy="projectGroup">Group</label>
      <select id="project-group"></select>
    </div>
    <p id="editor-error" class="popover-error" role="status"></p>
    <div class="editor-footer"><button id="cancel-project" type="button" data-copy="cancel">Cancel</button>
      <button id="save-project" type="submit">Create project</button></div>
  </form>
</dialog>
<dialog id="remote-project-dialog" class="editor-dialog" aria-labelledby="remote-project-title">
  <form method="dialog" class="editor">
    <h3 id="remote-project-title" data-copy="editRemoteProject">Edit remote project in Codex</h3>
    <p id="remote-project-instructions"></p>
    <p id="remote-project-error" role="status"></p>
    <div><button id="open-codex-home" type="button" data-copy="openCodexHome">Open Codex Home</button>
      <button data-copy="close">Close</button></div>
  </form>
</dialog>
<dialog id="group-dialog" class="editor-dialog" aria-labelledby="group-editor-title">
  <form id="group-editor" class="editor" novalidate>
    <h3 id="group-editor-title" data-copy="editGroup">Edit group</h3>
    <label for="edited-group-name" data-copy="groupName">Group name</label>
    <input id="edited-group-name" required maxlength="60">
    <p id="group-editor-error" class="popover-error" role="status"></p>
    <div><button type="submit" data-copy="save">Save</button> <button id="cancel-group-edit" type="button" data-copy="cancel">Cancel</button></div>
  </form>
</dialog>
<dialog id="archive-dialog" class="editor-dialog" aria-labelledby="archive-title">
  <div class="archive-heading"><h2 id="archive-title" data-copy="archive">Archive</h2><form method="dialog"><button data-copy="close">Close</button></form></div>
  <p id="archive-status" role="status"></p>
  <div id="archived-projects" class="archive-kind" hidden><h3 data-copy="hiddenProjects">Projects hidden in Nest</h3><ul></ul></div>
  <div id="archived-chats" class="archive-kind" hidden><h3 data-copy="chats">Chats</h3><ul></ul></div>
</dialog>
<dialog id="project-archive-dialog" class="editor-dialog" aria-labelledby="project-archive-title">
  <form id="project-archive-form" class="editor">
    <h3 id="project-archive-title" data-copy="archiveProjectChats">Archive project chats</h3>
    <p id="project-archive-summary"></p>
    <div><button type="submit" data-copy="archive">Archive</button>
      <button id="cancel-project-archive" type="button" data-copy="cancel">Cancel</button></div>
  </form>
</dialog>
<script type="application/json" id="initial-projects">{}</script>
<script>
const storageKey = "codex-nest.logical-layout.v2";
let groups = new Map();
let parents = new Map();
let collapsed = new Set();
let archives = {projects: new Set(), chats: new Set()};
try {
  const stored = JSON.parse(localStorage.getItem(storageKey)
    ?? localStorage.getItem("codex-nest.logical-layout.v1") ?? "{}");
  groups = new Map(stored.groups || []);
  parents = groupParents(new Map(stored.parents || []), groups);
  collapsed = new Set((stored.collapsed || []).filter(id => groups.has(id)));
  archives = {projects: new Set(stored.archivedProjects || []), chats: new Set(stored.archivedChats || [])};
} catch {}
let nodes = new Map();
const branchViews = new Map();
let dragSession = null;
let data = null;
let selected = null;
let chatSearchProject = null;
let connected = false;
let loadingProjects = false;
let refreshQueued = false;
let openingChat = false;
let projectEditor = null;
let editingGroup = null;
let savingProject = false;
let archiveTarget = null;
let archivingProject = false;
let menuAnchor = null;
let menuPoint = null;
let sequence = 0;
const pending = new Map();
const embedded = window.parent !== window;
const byId = id => document.getElementById(id);
const popover = byId("sidebar-popover");
const sidebar = document.querySelector("nav");
const copy = {
  projectTree: ["项目树", "Project tree"],
  projects: ["项目", "Projects"],
  project: ["项目", "Project"],
  group: ["分组", "Group"],
  chats: ["聊天", "Chats"],
  newChat: ["新建聊天", "New chat"],
  searchChats: ["搜索聊天标题", "Search chat titles"],
  noMatchingChats: ["没有匹配的聊天。", "No matching chats."],
  primaryUnavailable: ["项目的 Primary 目录不可用。", "The primary project directory is unavailable."],
  sidebarActions: ["项目区操作", "Project sidebar actions"],
  projectActions: ["项目操作", "Project actions"],
  groupActions: ["分组操作", "Group actions"],
  namedProjectActions: ["{name}的项目操作", "Project actions for {name}"],
  namedGroupActions: ["{name}的分组操作", "Group actions for {name}"],
  namedChatActions: ["{name}的聊天操作", "Chat actions for {name}"],
  newProject: ["新建项目", "New project"],
  editRemoteProject: ["在 Codex 中编辑远程项目", "Edit remote project in Codex"],
  editRemoteProjectInstructions: ["在 Codex 左侧栏找到「{name}」，从项目菜单选择「编辑项目」。保存后，返回 Nest 查看更新。", "Find “{name}” in the Codex sidebar and choose Edit project from its menu. Save and return to Nest to see the update."],
  remoteProject: ["远程", "Remote"],
  sourceDevice: ["来源设备", "Source device"],
  thisComputer: ["此电脑", "This computer"],
  remoteDevices: ["远程设备", "Remote devices"],
  projectGroup: ["所属分组", "Group"],
  remoteDirectory: ["远程目录", "Remote directory"],
  createProject: ["创建项目", "Create project"],
  creatingRemoteProject: ["正在验证目录并等待 Codex 注册。如果 Codex 弹出目录访问确认，请在弹窗中确认。", "Verifying the directory and waiting for Codex to register it. Confirm folder access if Codex prompts."],
  remoteAlreadyRegistered: ["该主机上的这个目录已注册为项目。", "This folder is already registered as a project on the selected host."],
  remoteHostUnavailable: ["该 SSH 主机在 Codex 中不可用。请刷新项目后重试。", "This SSH host is unavailable in Codex. Refresh projects and try again."],
  remotePathRequired: ["请输入远程主机上的绝对目录路径。", "Enter an absolute directory path on the remote host."],
  remotePathUnavailable: ["无法确认该远程目录。请检查 SSH 连接和路径。", "Could not verify the remote directory. Check the SSH connection and path."],
  desktopConfigBusy: ["Codex 桌面已有设置文件。请等现有设置操作完成后再试。", "A Codex desktop setup file already exists. Finish the existing setup before retrying."],
  remoteRegistrationUnconfirmed: ["尚未收到 Codex 注册确认。重试前请先刷新列表。", "Codex did not confirm registration. Refresh the list before retrying."],
  openCodexHome: ["打开 Codex 首页", "Open Codex Home"],
  openCodexHomeFailed: ["无法打开 Codex 首页。请从 Codex 左侧栏继续。", "Could not open Codex Home. Continue from the Codex sidebar."],
  remoteChatUnavailable: ["请在 Codex 中开启远程项目聊天。", "Start remote project chats in Codex."],
  newGroup: ["新建分组", "New group"],
  editProject: ["编辑项目", "Edit project"],
  editGroup: ["编辑分组", "Edit group"],
  groupName: ["分组名称", "Group name"],
  projectName: ["项目名称", "Project name"],
  foldersLabel: ["工作目录（每行一个现有目录）", "Working directories (one existing folder per line)"],
  chooseProject: ["选择一个项目或分组", "Select a project or group"],
  moveTo: ["移动到", "Move to"],
  move: ["移动", "Move"],
  topLevel: ["顶层", "Top level"],
  dropAtTop: ["移到顶层", "Move to top level"],
  save: ["保存", "Save"],
  cancel: ["取消", "Cancel"],
  close: ["关闭", "Close"],

let language = "en";
const liveCopy = new Map();

function t(key, params = {}) {
  return (copy[key]?.[language === "zh" ? 0 : 1] ?? "").replace(/\{(\w+)\}/g, (_, key) => String(params[key] ?? ""));
}

function setMessage(id, key, params) {
  if (key) liveCopy.set(id, [key, params]);
  else liveCopy.delete(id);
  byId(id).textContent = key ? t(key, params) : "";
}

function applyLocale(locale) {
  if (!locale) return;
  const next = /^zh(?:[-_]|$)/i.test(locale) ? "zh" : "en";
  if (next === language && document.documentElement.lang === next && localeReady) return;
  language = next;
  localeReady = true;
  document.documentElement.lang = next;
  names = new Intl.Collator(next, {numeric: true, sensitivity: "base"});
  for (const el of document.querySelectorAll("[data-copy]")) el.textContent = t(el.dataset.copy);
  for (const [from, to] of [["data-copy-label", "aria-label"], ["data-copy-title", "title"], ["data-copy-placeholder", "placeholder"]]) {
    for (const el of document.querySelectorAll("[" + from + "]")) {
      el.setAttribute(to, t(el.getAttribute(from)));
    }
  }
  const savedCopy = new Map(liveCopy);
  if (savedCopy.get("hint")?.[0] === "noMatchingChats") savedCopy.delete("hint");
  if (data) render();
  for (const [id, args] of savedCopy) setMessage(id, ...args);
}

let localeReady = false;
let names;

function applyHostContext(context) {
  applyTheme(context);
  applyLocale(context?.locale);
}

class InterfaceError extends Error {
  constructor(key, params) {
    super(t(key, params));
    this.key = key;
    this.params = params;
  }
}

function showError(id, error) {
  if (error instanceof InterfaceError) setMessage(id, error.key, error.params);
  else setMessage(id, "actionFailed");
}

function chatTitle(chat) {
  return chat.title || t("untitledChat");
}

const hostColors = [
  "--color-background-primary", "--color-background-secondary", "--color-background-tertiary",
  "--color-text-primary", "--color-text-secondary", "--color-border-secondary",
];

function applyTheme(context) {
  if (!context) return;
  const root = document.documentElement;
  const theme = context.theme;
  const changed = (theme === "light" || theme === "dark") && root.dataset.theme !== theme;
  if (changed) root.dataset.theme = theme;
  const variables = context.styles?.variables;
  if (!variables && !changed) return;
  for (const name of hostColors) {
    const value = variables?.[name];
    if (typeof value === "string" && CSS.supports("color", value)) root.style.setProperty(name, value);
    else root.style.removeProperty(name);
  }
}

function send(message) {
  window.parent.postMessage({jsonrpc: "2.0", ...message}, "*");
}

function request(method, params, timeoutMs = 8000) {
  const id = ++sequence;
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      pending.delete(id);
      reject(new Error("Host response timed out"));
    }, timeoutMs);
    pending.set(id, message => {
      clearTimeout(timeout);
      if (message.error) reject(new Error(message.error.message));
      else resolve(message.result);
    });
    send({id, method, params});
  });
}

window.addEventListener("message", event => {
  if (!embedded || event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
  const message = event.data;
  if (pending.has(message.id)) {
    const complete = pending.get(message.id);
    pending.delete(message.id);
    complete(message);
  } else if (message.method === "ui/notifications/tool-result") {
    receive(message.params);
  } else if (message.method === "ui/notifications/host-context-changed") {
    applyHostContext(message.params);
  }
});

function receive(result) {
  const snapshot = result?.structuredContent;
  if (snapshot?.source !== "local_registry") return false;
  if (typeof snapshot?.error === "string") {
    setMessage("status", snapshot.errorKey ?? "readProjectsFailed");
    return true;
  }
  if (!Array.isArray(snapshot?.projects)) return false;
  if (data && JSON.stringify(snapshot) === JSON.stringify(data)) {
    renderProjectStatus();
    return true;
  }
  data = snapshot;
  render();
  return true;
}

function saveLayout(nextGroups, nextParents, nextCollapsed, nextArchives = archives) {
  try {
    localStorage.setItem(storageKey, JSON.stringify({
      groups: [...nextGroups], parents: [...nextParents], collapsed: [...nextCollapsed],
      archivedProjects: [...nextArchives.projects], archivedChats: [...nextArchives.chats],
    }));
  } catch {
    setMessage("layout-message", "saveLayoutFailed");
    return false;
  }
  groups = nextGroups;
  parents = nextParents;
  collapsed = nextCollapsed;
  archives = nextArchives;
  setMessage("layout-message");
  return true;
}

function groupParents(saved, groups) {
  const result = new Map();
  for (const id of saved.keys()) {
    const visited = new Set([id]);
    let parent = saved.get(id);
    while (parent && !visited.has(parent)) {
      if (groups.has(parent)) {
        result.set(id, parent);
        break;
      }
      visited.add(parent);
      parent = saved.get(parent);
    }
  }
  return result;
}

function canParent(id, parent) {
  const visited = new Set([id]);
  while (parent) {
    if (!groups.has(parent) || visited.has(parent)) return false;
    visited.add(parent);
    parent = parents.get(parent);
  }
  return true;
}

function buildTree(projects) {
  nodes = new Map();
  for (const [id, label] of groups) {
    nodes.set(id, {id, label, children: new Map()});
  }
  for (const project of projects) {
    const id = "project:" + project.id;
    nodes.set(id, {id, label: project.label, project, children: new Map()});
  }
  const roots = new Map();
  for (const node of nodes.values()) {
    const parent = nodes.get(parents.get(node.id));
    const branch = parent && canParent(node.id, parent.id) ? parent.children : roots;
    branch.set(node.id, node);
  }
  return roots;
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}


function measureProjectLabel(label) {
  const distance = Math.max(0, label.firstElementChild.scrollWidth - label.clientWidth);
  label.classList.toggle("is-overflowing", distance > 0);
  label.style.setProperty("--name-travel", `-${distance}px`);
  label.style.setProperty("--name-duration", `${Math.min(10, Math.max(0.8, distance / 55))}s`);
}

function startProjectDrag(event, node, row) {
  if (!event.dataTransfer || savingProject) {
    event.preventDefault();
    return;
  }
  finishProjectDrag();
  closeMenu();
  event.dataTransfer.setData("application/x-codex-nest-project", "project");
  event.dataTransfer.effectAllowed = "move";
  dragSession = {id: node.id, row, target: null, preview: new Set(), timer: null};
  row.classList.add("drag-source");
  sidebar.classList.add("project-dragging");
}

function dropParent(element) {
  const row = element.closest(".row[data-node-id]");
  const rowId = row?.dataset.nodeId;
  const groupId = groups.has(rowId) ? rowId : element.closest("ul[data-group-id]")?.dataset.groupId;
  if (groupId) return canParent(dragSession.id, groupId) ? groupId : null;
  if (row) return null;
  return element.closest(".tree-heading, p, form, button, input") ? null : "";
}

function markDropTarget(parent) {
  const drag = dragSession;
  if (!drag || drag.target === parent) return;
  clearTimeout(drag.timer);
  const marker = id => id === "" ? byId("root-drop") : branchViews.get(id)?.row;
  marker(drag.target)?.classList.remove("drop-target");
  drag.target = parent;
  marker(parent)?.classList.add("drop-target");
  const branch = branchViews.get(parent);
  if (branch?.update && collapsed.has(parent) && !drag.preview.has(parent)) {
    drag.timer = setTimeout(() => {
      if (dragSession !== drag || drag.target !== parent) return;
      drag.preview.add(parent);
      branch.update();
    }, 450);
  }
}

function finishProjectDrag() {
  const drag = dragSession;
  if (!drag) return;
  markDropTarget(null);
  clearTimeout(drag.timer);
  dragSession = null;
  drag.row.classList.remove("drag-source");
  sidebar.classList.remove("project-dragging");
  for (const id of drag.preview) branchViews.get(id)?.update?.();
}

sidebar.addEventListener("dragover", event => {
  if (!dragSession) return;
  const parent = dropParent(event.target);
  markDropTarget(parent);
  if (parent !== null) {
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
  }
});
sidebar.addEventListener("drop", event => {
  if (!dragSession) return;
  const parent = dropParent(event.target);
  const id = dragSession.id;
  finishProjectDrag();
  if (parent === null) return;
  event.preventDefault();
  moveNode(id, parent);
});
document.addEventListener("dragover", event => {
  if (dragSession && !sidebar.contains(event.target)) markDropTarget(null);
});
sidebar.addEventListener("dragleave", event => {
  if (!(event.relatedTarget instanceof Node && sidebar.contains(event.relatedTarget)) &&
      !sidebar.contains(document.elementFromPoint(event.clientX, event.clientY))) markDropTarget(null);
});
document.addEventListener("dragend", finishProjectDrag);

function treeIcon(kind) {
  const namespace = "http://www.w3.org/2000/svg";
  const icon = document.createElementNS(namespace, "svg");
  icon.setAttribute("class", "tree-icon " + kind);
  icon.setAttribute("viewBox", "0 0 16 12");
  icon.setAttribute("aria-hidden", "true");
  icon.setAttribute("fill", "none");
  icon.setAttribute("stroke", "currentColor");
  icon.setAttribute("stroke-width", "1.5");
  icon.setAttribute("stroke-linejoin", "round");
  icon.setAttribute("stroke-linecap", "round");
  const closed = document.createElementNS(namespace, "path");
  closed.setAttribute("class", "icon-closed");
  closed.setAttribute("d", kind === "group"
    ? "M1.5 9.25v-7Q1.5 1 2.75 1h3.1l1.5 1.75h5.9Q14.5 2.75 14.5 4v5.25q0 1.25-1.25 1.25H2.75Q1.5 10.5 1.5 9.25Z"
    : "M2.75 1h10.5q1.25 0 1.25 1.25v7q0 1.25-1.25 1.25H2.75Q1.5 10.5 1.5 9.25v-7Q1.5 1 2.75 1ZM1.5 4h13");
  const open = document.createElementNS(namespace, "path");
  open.setAttribute("class", "icon-open");
  open.setAttribute("d", kind === "group"
    ? "M1.5 10.5V2.25Q1.5 1 2.75 1h3.1l1.5 1.75h4.6Q13.2 2.75 13.2 4v1.2M1.5 10.5h10.7l2.3-5.3H4.25Z"
    : closed.getAttribute("d") + "M4.2 6.4h7.6m-7.6 2h4.5");
  icon.append(closed, open);
  return icon;
}

window.addEventListener("resize", () => {
  for (const label of document.querySelectorAll(".name:is(:hover, :focus-visible) .project-label")) {
    measureProjectLabel(label);
  }
});

function renderNodes(nodes, groupId) {
  const list = element("ul");
  if (groupId) list.dataset.groupId = groupId;
  for (const node of [...nodes.values()].sort((a, b) =>
    names.compare(a.label, b.label) || a.id.localeCompare(b.id))) {
    const item = element("li");
    const row = element("div", undefined, "row");
    const button = element("button", undefined, node.project ? "name" : "name group-name");
    row.dataset.nodeId = node.id;
    if (!node.project) branchViews.set(node.id, {row});
    if (node.project) {
      button.draggable = true;
      button.addEventListener("dragstart", event => startProjectDrag(event, node, row));
    }
    let toggleBranch;
    item.append(row);
    if (node.children.size) {
      const toggle = element("button", undefined, "toggle");
      const children = renderNodes(node.children, node.id);
      toggle.type = "button";
      function updateBranch() {
        children.hidden = collapsed.has(node.id) && !dragSession?.preview.has(node.id);
        const expanded = String(!children.hidden);
        toggle.setAttribute("aria-label", t(children.hidden ? "expand" : "collapse", {name: node.label}));
        toggle.setAttribute("aria-expanded", expanded);
        button.setAttribute("aria-expanded", expanded);
      }
      toggleBranch = () => {
        const next = new Set(collapsed);
        if (next.has(node.id)) next.delete(node.id);
        else next.add(node.id);
        if (saveLayout(groups, parents, next)) updateBranch();
      };
      branchViews.get(node.id).update = updateBranch;
      updateBranch();
      toggle.addEventListener("click", toggleBranch);
      row.append(toggle);
      item.append(children);
    } else {
      row.append(element("span", "", "spacer"));
    }
    const label = element("span", undefined, "project-label");
    label.append(element("span", node.label, "project-label-text"));
    button.append(treeIcon(node.project ? "project" : "group"), label);
    if (node.project?.hostId) button.append(element("span", t("remoteProject"), "remote-label"));
    button.addEventListener("pointerenter", () => measureProjectLabel(label));
    button.addEventListener("focus", () => measureProjectLabel(label));
    button.type = "button";
    button.setAttribute("aria-current", String(selected === node.id));
    button.addEventListener("click", () => {
      if (savingProject) return;
      if (selected !== node.id) closeProjectEditor();
      toggleBranch?.();
      selected = node.id;
      byId("tree").querySelector('[aria-current="true"]')?.setAttribute("aria-current", "false");
      button.setAttribute("aria-current", "true");
      renderDetails();
    });
    row.append(button);
    const actions = element("button", "…", "icon-action row-actions");
    actions.type = "button";
    actions.title = t(node.project ? "projectActions" : "groupActions");
    actions.setAttribute("aria-label", t(node.project ? "namedProjectActions" : "namedGroupActions", {name: node.label}));
    actions.setAttribute("aria-expanded", "false");
    actions.setAttribute("aria-controls", "sidebar-popover");
    actions.addEventListener("click", () => {
      if (node.project) openProjectMenu(actions, node.project);
      else openGroupMenu(actions, node);
    });
    row.append(actions);
    list.append(item);
  }
  return list;
}

function closeMenu(restoreFocus = false) {
  if (!menuAnchor) return;
  const anchor = menuAnchor;
  menuAnchor = null;
  if (!menuPoint) anchor.setAttribute("aria-expanded", "false");
  menuPoint = null;
  popover.hidePopover();
  if (restoreFocus) anchor.focus({preventScroll: true});
}

function positionMenu() {
  if (!menuAnchor) return;
  const rect = menuAnchor.getBoundingClientRect();
  const width = popover.offsetWidth;
  const rightSide = innerWidth - rect.right >= width + 16;
  const left = menuPoint?.x ?? (rightSide ? rect.right + 8 : rect.right - width);
  const top = menuPoint?.y ?? (rightSide ? rect.top : rect.bottom + 5);
  popover.style.left = Math.max(8, Math.min(left, innerWidth - width - 8)) + "px";
  popover.style.top = Math.max(8, Math.min(top, innerHeight - popover.offsetHeight - 8)) + "px";
}

function openMenu(anchor, items, point = null) {
  const alreadyOpen = menuAnchor === anchor && !menuPoint && !point;
  closeMenu();
  if (alreadyOpen) return;
  popover.classList.toggle("context-actions", Boolean(point));
  popover.replaceChildren(...items);
  popover.showPopover();
  menuAnchor = anchor;
  menuPoint = point;
  if (!point) anchor.setAttribute("aria-expanded", "true");
  positionMenu();
  popover.querySelector("button:not(:disabled)")?.focus({preventScroll: true});
}

function menuAction(label, action, iconType) {
  const button = element("button", undefined, "row popover-action");
  button.type = "button";
  if (iconType) {
    const icon = element("span", undefined, "node-icon " + iconType);
    icon.setAttribute("aria-hidden", "true");
    button.append(icon);
  }
  button.append(element("span", label, "name-label"));
  button.addEventListener("click", action);
  return button;
}

function openProjectMenu(anchor, project) {
  const items = [element("h3", project.label, "popover-heading")];
  const hide = menuAction(t("hideProject"), () => updateArchive("projects", project.id, true));
  const archive = menuAction(t("archiveProjectChats"), () => confirmProjectArchive(project));
  archive.disabled = !connected || data.initial || archivingProject || !project.chats.length ||
    (project.hostId ? Boolean(project.chatError) : data.chatSource !== "codex");
  if (project.hostId) {
    const edit = menuAction(t("editRemoteProject"), () => showRemoteProjectHandoff(project));
    items.push(element("p", t("remoteProject"), "popover-meta"),
      element("p", project.path, "popover-meta"), element("div", undefined, "popover-divider"), edit, archive, hide);
    openMenu(anchor, items);
    return;
  }
  if (!data.initial) {
    const count = project.chats.filter(chat => !archives.chats.has(chat.id)).length;
    items.push(element("p", t(count === 1 ? "oneChat" : "chatCount", {count}), "popover-meta"));
  }
  const enabled = connected && data.canManage && Boolean(project.nativeId) && !savingProject;
  const error = element("p", "", "popover-error");
  error.setAttribute("role", "status");
  if (project.folders.length) items.push(element("div", undefined, "popover-divider"));
  for (const folder of project.folders) {
    const folderButton = menuAction(folder, async () => {
      folderButton.disabled = true;
      error.textContent = "";
      try {
        await runProjectAction("open_project_folder", {projectId: project.nativeId, folder});
        if (menuAnchor === anchor) closeMenu(true);
      } catch (failure) {
        error.textContent = failure.message;
        positionMenu();
      } finally {
        folderButton.disabled = false;
      }
    }, "group");
    folderButton.title = t("openFinder");
    folderButton.disabled = !enabled;
    items.push(folderButton);
  }
  const edit = menuAction(t("editProject"), () => {
    closeMenu(true);
    showProjectEditor(project);
  });
  edit.disabled = !enabled;
  items.push(element("div", undefined, "popover-divider"), edit, archive, hide, error);
  openMenu(anchor, items);
}

function openGroupMenu(anchor, group) {
  const edit = menuAction(t("editGroup"), () => {
    closeMenu(true);
    editingGroup = group.id;
    const input = byId("edited-group-name");
    input.value = groups.get(editingGroup);
    setMessage("group-editor-error");
    byId("group-dialog").showModal();
    input.select();
  });
  openMenu(anchor, [element("h3", group.label, "popover-heading"), edit]);
}

byId("cancel-group-edit").addEventListener("click", () => byId("group-dialog").close());
byId("group-dialog").addEventListener("close", () => { editingGroup = null; });
byId("group-editor").addEventListener("submit", event => {
  event.preventDefault();
  if (!groups.has(editingGroup)) return;
  const name = byId("edited-group-name").value.trim();
  if (!name) {
    setMessage("group-editor-error", "groupNameRequired");
    return;
  }
  if (!saveLayout(new Map(groups).set(editingGroup, name), parents, collapsed)) {
    setMessage("group-editor-error", "saveGroupFailed");
    return;
  }
  byId("group-dialog").close();
  render();
});

function showCreateGroup() {
  closeMenu();
  byId("create-group").hidden = false;
  byId("group-name").focus();
}

function showRemoteProjectHandoff(project) {
  closeMenu(true);
  setMessage("remote-project-instructions", "editRemoteProjectInstructions", {name: project.label});
  setMessage("remote-project-error");
  byId("open-codex-home").disabled = !connected;
  byId("remote-project-dialog").showModal();
}

byId("open-codex-home").addEventListener("click", async () => {
  try {
    await request("ui/open-link", {url: "codex://threads/new"});
    byId("remote-project-dialog").close();
  } catch {
    setMessage("remote-project-error", "openCodexHomeFailed");
  }
});

byId("sidebar-menu").addEventListener("click", () => {
  const addGroup = menuAction(t("newGroup"), showCreateGroup);
  const refreshProjects = menuAction(t("refreshProjects"), () => { closeMenu(true); load(); });
  refreshProjects.disabled = !connected || loadingProjects;
  const archived = menuAction(t("archive"), () => {
    closeMenu(true);
    renderArchive();
    byId("archive-dialog").showModal();
  });
  openMenu(byId("sidebar-menu"), [addGroup, refreshProjects, archived]);
});
document.querySelector("nav").addEventListener("contextmenu", event => {
  if (!data || event.target.closest(".row, .tree-heading, p, form, button, input")) return;
  event.preventDefault();
  const create = menuAction(t("createProject"), () => showProjectEditor(null), "project");
  create.disabled = !canCreateProject();
  openMenu(byId("sidebar-menu"), [
    create, menuAction(t("newGroup"), showCreateGroup, "group"),
  ], {x: event.clientX, y: event.clientY});
});
document.addEventListener("pointerdown", event => {
  if (menuAnchor && !popover.contains(event.target) && (menuPoint || !menuAnchor.contains(event.target))) {
    closeMenu();
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && menuAnchor) {
    event.preventDefault();
    closeMenu(true);
  }
});
window.addEventListener("resize", positionMenu);
document.querySelector("nav").addEventListener("scroll", () => closeMenu());

function chatLink(chat, className) {
  const link = element("a", undefined, className);
  link.href = "codex://threads/" + encodeURIComponent(chat.id) +
    (chat.hostId ? "?hostId=" + encodeURIComponent(chat.hostId) : "");
  link.addEventListener("click", async event => {
    if (!embedded) return;
    event.preventDefault();
    try { await request("ui/open-link", {url: link.href}); }
    catch {
      const status = byId("archive-dialog").open ? "archive-status" : "hint";
      setMessage(status, "openChatFailed");
    }
  });
  return link;
}

function archiveRow(title, subtitle, restore) {
  const row = element("li", undefined, "row archive-entry");
  const label = element("div");
  label.append(typeof title === "string" ? document.createTextNode(title) : title);
  if (subtitle) label.append(element("small", subtitle));
  const action = element("button", t("restore"));
  action.type = "button";
  action.setAttribute("aria-label", t("restoreNamed", {name: label.firstChild.textContent}));
  action.addEventListener("click", restore);
  row.append(label, action);
  return row;
}

function renderArchive() {
  const projects = [];
  const chats = [];
  for (const project of data.projects) {
    if (archives.projects.has(project.id)) {
      projects.push(archiveRow(project.label, "", () => updateArchive("projects", project.id, false)));
    }
    for (const chat of project.chats) {
      if (!archives.chats.has(chat.id)) continue;
      const link = chatLink(chat);
      link.textContent = chatTitle(chat);
      chats.push(archiveRow(link, project.label, () => updateArchive("chats", chat.id, false)));
    }
  }
  for (const [container, rows] of [["archived-projects", projects], ["archived-chats", chats]]) {
    const panel = byId(container);
    panel.hidden = !rows.length;
    panel.querySelector("ul").replaceChildren(...rows);
  }
  setMessage("archive-status", projects.length || chats.length ? null : "noArchive");
}

function updateArchive(kind, id, archived) {
  const next = new Set(archives[kind]);
  if (archived) next.add(id);
  else next.delete(id);
  if (!saveLayout(groups, parents, collapsed, {...archives, [kind]: next})) {
    if (byId("archive-dialog").open) setMessage("archive-status", "saveArchiveFailed");
    return;
  }
  if (kind === "projects" && archived && selected === "project:" + id) selected = null;
  render();
}

function confirmProjectArchive(project) {
  closeMenu(true);
  const {id, hostId, label, chats} = project;
  archiveTarget = {projectId: id, hostId, chatIds: chats.map(chat => chat.id)};
  setMessage("project-archive-summary", "archiveProjectChatsConfirm", {name: label, count: chats.length});
  byId("project-archive-dialog").showModal();
}

byId("cancel-project-archive").addEventListener("click", () => byId("project-archive-dialog").close());
byId("project-archive-dialog").addEventListener("cancel", event => {
  if (archivingProject) event.preventDefault();
});
byId("project-archive-form").addEventListener("submit", async event => {
  event.preventDefault();
  if (archivingProject || !archiveTarget) return;
  archivingProject = true;
  const buttons = [...event.currentTarget.querySelectorAll("button")];
  for (const button of buttons) button.disabled = true;
  try {
    const result = await runProjectAction("archive_project_chats", archiveTarget);
    setMessage("layout-message", "archiveProjectChatsDone", {count: result.archivedCount});
  } catch (error) {
    showError("layout-message", error);
  } finally {
    archiveTarget = null;
    archivingProject = false;
    for (const button of buttons) button.disabled = false;
    byId("project-archive-dialog").close();
    load();
  }
});

function renderDetails() {
  const node = nodes.get(selected);
  const project = node?.project;
  byId("project").textContent = node?.label ?? t("chooseProject");
  setMessage("project-home-status", project?.homeSync === false ? "homeProjectOutdated" : null);
  byId("move-node").hidden = !node;
  if (node) {
    const select = byId("parent");
    select.replaceChildren(new Option(t("topLevel"), ""));
    const destinations = [...nodes.values()].filter(item => canParent(node.id, item.id))
      .sort((a, b) => names.compare(a.label, b.label));
    for (const destination of destinations) {
      const kind = t(destination.project ? "project" : "group");
      select.add(new Option(kind + " · " + destination.label, destination.id));
    }
    const parent = parents.get(node.id);
    select.value = destinations.some(item => item.id === parent) ? parent : "";
  }
  const projectId = project?.id ?? null;
  if (chatSearchProject !== projectId) {
    byId("chat-search").value = "";
    chatSearchProject = projectId;
  }
  byId("conversations").hidden = !project;
  updateNewChat(project);
  renderChatList(project);
}

function renderChatList(project) {
  const activeChats = project?.chats.filter(chat => !archives.chats.has(chat.id)) ?? [];
  const query = byId("chat-search").value.trim().normalize().toLocaleLowerCase(language);
  const visibleChats = activeChats.filter(chat => chatTitle(chat).normalize().toLocaleLowerCase(language).includes(query));
  let hint = null;
  if (project?.chatError) hint = "remoteChatsUnavailable";
  else if (project && !activeChats.length) hint = data.initial ? "chatsNeedConnection" : "noActiveChats";
  else if (query && !visibleChats.length) hint = "noMatchingChats";
  setMessage("hint", hint);
  const chats = byId("chats");
  chats.replaceChildren();
  for (const chat of visibleChats) {
    const li = element("li", undefined, "row");
    const link = chatLink(chat, "row chat-row");
    const icon = element("span", undefined, "node-icon chat");
    icon.setAttribute("aria-hidden", "true");
    link.append(icon, element("span", chatTitle(chat), "name-label"));
    const actions = element("button", "…", "icon-action row-actions");
    actions.type = "button";
    actions.setAttribute("aria-label", t("namedChatActions", {name: chatTitle(chat)}));
    actions.setAttribute("aria-expanded", "false");
    actions.setAttribute("aria-controls", "sidebar-popover");
    actions.addEventListener("click", () =>
      openMenu(actions, [menuAction(t("archiveChat"), () => updateArchive("chats", chat.id, true))]));
    li.append(link, actions);
    chats.append(li);
  }
}

byId("chat-search").addEventListener("input", () => {
  closeMenu();
  renderChatList(nodes.get(selected)?.project);
});

function updateNewChat(project) {
  const button = byId("new-chat");
  button.disabled = openingChat || !connected || !data?.canManage || !project?.nativeId || !project.path || Boolean(project.hostId);
  button.title = t(project?.hostId ? "remoteChatUnavailable" : project && !project.path ? "primaryUnavailable" : "newChat");
}

byId("new-chat").addEventListener("click", async () => {
  const project = nodes.get(selected)?.project;
  if (byId("new-chat").disabled || !project?.nativeId) return;
  const projectId = selected;
  openingChat = true;
  updateNewChat(project);
  try {
    await runProjectAction("open_project_chat", {projectId: project.nativeId});
  } catch (error) {
    if (selected === projectId) showError("hint", error);
  } finally {
    openingChat = false;
    updateNewChat(nodes.get(selected)?.project);
  }
});

function renderProjectStatus() {
  setMessage("status", data.chatSource === "legacy"
    ? "legacyChats" : data.projects.length ? "localProjects" : "noProjects");
}

function render() {
  finishProjectDrag();
  branchViews.clear();
  closeMenu();
  renderProjectStatus();
  const create = byId("new-project");
  create.disabled = !canCreateProject();
  byId("sidebar-menu").disabled = false;
  const projects = data.projects.filter(project => !archives.projects.has(project.id));
  byId("tree").replaceChildren(renderNodes(buildTree(projects)));
  renderDetails();
  if (byId("archive-dialog").open) renderArchive();
}

async function runProjectAction(name, arguments_, timeout = 26000) {
  setMessage("project-action-status");
  let reply;
  try {
    reply = await request("tools/call", {name, arguments: arguments_}, timeout);
  } catch {
    throw new InterfaceError("actionTimeout");
  }
  if (reply?.structuredContent?.error) {
    const {errorKey, errorParams} = reply.structuredContent;
    throw new InterfaceError(Object.hasOwn(copy, errorKey) ? errorKey : "actionFailed", errorParams);
  }
  if (reply?.isError || !reply?.structuredContent) throw new InterfaceError("noActionResult");
  return reply.structuredContent;
}

function canCreateProject() {
  return connected && !savingProject && (data?.canManage || Boolean(data?.remoteHosts?.length));
}

function updateProjectSource() {
  const isRemote = Boolean(byId("project-device").value);
  byId("local-project-folders").hidden = isRemote;
  byId("remote-project-folder").hidden = !isRemote;
}

function projectGroupOptions() {
  return [...groups].map(([id, label]) => {
    const trail = [label];
    for (let parent = parents.get(id); groups.has(parent); parent = parents.get(parent)) {
      trail.unshift(groups.get(parent));
    }
    return new Option(trail.join(" / "), id);
  }).sort((a, b) => names.compare(a.text, b.text));
}

function showProjectEditor(project) {
  if (project ? savingProject || !connected || !data?.canManage : !canCreateProject()) return;
  closeMenu(true);
  projectEditor = {project, attempt: null};
  setMessage("project-action-status");
  setMessage("editor-error");
  setMessage("editor-title", project ? "editProject" : "createProject");
  setMessage("save-project", project ? "save" : "createProject");
  byId("project-name").value = project?.label ?? "";
  byId("project-folders").value = project?.folders.join("\n") ?? "";
  byId("project-remote-path").value = "";
  byId("project-device-field").hidden = Boolean(project);
  byId("project-group-field").hidden = Boolean(project);
  const device = byId("project-device");
  const local = new Option(t("thisComputer"), "");
  local.dataset.copy = "thisComputer";
  local.disabled = !data.canManage;
  device.replaceChildren(local);
  const hosts = data.remoteHosts ?? [];
  if (!project && hosts.length) {
    const remotes = element("optgroup");
    remotes.label = t("remoteDevices");
    for (const host of hosts) remotes.append(new Option(host.label, host.id));
    device.append(remotes);
  }
  device.value = data.canManage ? "" : hosts[0].id;
  const group = byId("project-group");
  const top = new Option(t("topLevel"), "");
  top.dataset.copy = "topLevel";
  group.replaceChildren(top, ...projectGroupOptions());
  group.value = groups.has(selected) ? selected : "";
  updateProjectSource();
  byId("editor-dialog").showModal();
  byId("project-name").focus();
}

byId("project-device").addEventListener("change", updateProjectSource);
byId("new-project").addEventListener("click", () => showProjectEditor(null));
function closeProjectEditor() {
  if (byId("editor-dialog").open) byId("editor-dialog").close();
  projectEditor = null;
  setMessage("project-action-status");
}
byId("cancel-project").addEventListener("click", closeProjectEditor);
byId("editor-dialog").addEventListener("cancel", event => {
  event.preventDefault();
  if (!savingProject) closeProjectEditor();
});
byId("project-editor").addEventListener("submit", async event => {
  event.preventDefault();
  const editor = projectEditor;
  if (!editor || savingProject || !connected) return;
  const hostId = editor.project ? "" : byId("project-device").value;
  const group = byId("project-group").value;
  const path = byId("project-remote-path").value.trim();
  if (!hostId && !data.canManage) return;
  const fields = {
    name: byId("project-name").value.trim(),
    folders: byId("project-folders").value.split("\n").map(line => line.trim()).filter(Boolean),
  };
  if (!fields.name || (hostId ? !path : !fields.folders.length)) {
    setMessage("editor-error", !fields.name ? "projectNameRequired" : hostId ? "remotePathRequired" : "folderRequired");
    return;
  }
  if (!hostId && !editor.project) {
    const signature = JSON.stringify(fields);
    if (editor.attempt?.signature !== signature) {
      editor.attempt = {signature, id: Array.from(crypto.getRandomValues(new Uint32Array(4))).join("-")};
    }
  }
  const controls = [...event.currentTarget.querySelectorAll("button, input, textarea, select"), byId("new-project")];
  savingProject = true;
  for (const control of controls) control.disabled = true;
  setMessage("editor-error", hostId ? "creatingRemoteProject" : null);
  try {
    const result = hostId
      ? await runProjectAction("create_remote_project", {hostId, name: fields.name, path}, 80000)
      : await runProjectAction(editor.project ? "edit_project" : "create_project", editor.project
        ? {...fields, projectId: editor.project.nativeId} : {...fields, requestId: editor.attempt.id});
    const project = result.project;
    if (!project) throw new InterfaceError("noSavedProject");
    const previous = data.projects.find(item => item.id === project.id);
    if (previous) project.chats = previous.chats;
    data.projects = [...data.projects.filter(item => item.id !== project.id), project];
    selected = "project:" + project.id;
    if (!editor.project && !result.alreadyRegistered && groups.has(group)) {
      const expanded = new Set(collapsed);
      for (let id = group; id; id = parents.get(id)) expanded.delete(id);
      saveLayout(groups, new Map(parents).set(selected, group), expanded);
    }
    closeProjectEditor();
    setMessage("project-action-status", editor.project ? "projectSaved" : result.alreadyRegistered
      ? "remoteAlreadyRegistered" : "projectCreated");
  } catch (error) {
    showError("editor-error", error);
  } finally {
    savingProject = false;
    for (const control of controls) control.disabled = false;
    render();
    if (!projectEditor || refreshQueued) load();
  }
});

byId("create-group").addEventListener("submit", event => {
  event.preventDefault();
  const input = byId("group-name");
  const name = input.value.trim();
  if (!name) {
    setMessage("layout-message", "groupNameRequired");
    return;
  }
  const id = "group:" + Array.from(crypto.getRandomValues(new Uint32Array(4))).join("-");
  if (!saveLayout(new Map(groups).set(id, name), parents, collapsed)) return;
  selected = id;
  input.value = "";
  byId("create-group").hidden = true;
  render();
});

function moveNode(id, parent) {
  if (!nodes.has(id) || (parent && (!nodes.has(parent) || !canParent(id, parent)))) return;
  const nextParents = new Map(parents);
  if (parent) nextParents.set(id, parent);
  else nextParents.delete(id);
  const expanded = new Set(collapsed);
  for (let id = parent; id && nodes.has(id); id = nextParents.get(id)) expanded.delete(id);
  if (saveLayout(groups, nextParents, expanded)) render();
}

byId("move-node").addEventListener("submit", event => {
  event.preventDefault();
  moveNode(selected, byId("parent").value);
});

async function load() {
  if (!connected) return;
  if (loadingProjects || savingProject) {
    refreshQueued = true;
    return;
  }
  refreshQueued = false;
  loadingProjects = true;
  try {
    if (!receive(await request("tools/call", {name: "logical_projects", arguments: {}}, 20000))) {
      throw new Error("No local project data");
    }
  } catch {
    setMessage("status", data ? "refreshFailedWithData" : "refreshFailed");
  } finally {
    loadingProjects = false;
    if (refreshQueued) {
      refreshQueued = false;
      load();
    }
  }
}

function refreshVisibleProjects() {
  if (!document.hidden) load();
}

applyLocale(navigator.language || "en");
const hasInitialData = receive({structuredContent: JSON.parse(byId("initial-projects").textContent)});
if (!embedded) {
  if (!hasInitialData) setMessage("status", "openInCodex");
} else {
  document.addEventListener("visibilitychange", refreshVisibleProjects);
  window.addEventListener("focus", refreshVisibleProjects);

  // The host can hide an embedded panel without changing the document's visibility state.
  let panelVisible;
  new IntersectionObserver(([entry]) => {
    const returned = panelVisible === false && entry.isIntersecting;
    panelVisible = entry.isIntersecting;
    if (returned) refreshVisibleProjects();
  }).observe(document.documentElement);

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: {name: "codex-nest", version: "0.4.14"},
    appCapabilities: {},
  }).then(result => {
    connected = true;
    if (data) render();
    applyHostContext(result?.hostContext);
    send({method: "ui/notifications/initialized"});
    load();
  }).catch(() => {
    if (data) setMessage("status", "notConnectedWithData");
    else if (!hasInitialData) setMessage("status", "notConnected");
  });
}
</script>
